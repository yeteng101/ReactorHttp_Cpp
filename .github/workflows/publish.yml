name: CD · 发布镜像到 GHCR

# 推送到 main / feature/cloud-drive 即自动测试 + 构建镜像并推送到 GHCR；
# 打 v* tag 会额外生成语义化版本标签（3.1.0 / 3.1），也支持手动触发。
on:
  push:
    branches:
      - main
      - feature/cloud-drive
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 编译并运行测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 OpenSSL 开发库（AI 直连 TLS）
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: make test（编译 + 运行单元测试）
        run: make test

  publish:
    name: 构建并推送镜像
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 计算镜像名（GHCR 要求全小写）
        id: images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "netdisk=ghcr.io/${owner}/reactor-http" >> "$GITHUB_OUTPUT"
          echo "sidecar=ghcr.io/${owner}/reactor-http-sidecar" >> "$GITHUB_OUTPUT"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成主服务镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.netdisk }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/cloud-drive' }}

      - name: 构建并推送网盘主服务镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 生成 sidecar 镜像标签
        id: meta-sidecar
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.sidecar }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/cloud-drive' }}

      - name: 构建并推送 sidecar 镜像（仅 OAuth 桥接，可选）
        uses: docker/build-push-action@v6
        with:
          context: sidecar
          file: sidecar/Dockerfile
          push: true
          tags: ${{ steps.meta-sidecar.outputs.tags }}
          labels: ${{ steps.meta-sidecar.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写入构建摘要
        run: |
          {
            echo "### 已推送镜像"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${{ steps.meta-sidecar.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

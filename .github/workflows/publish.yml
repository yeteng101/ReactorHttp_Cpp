name: 发布镜像到 GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送网盘主服务镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reactor-http:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/reactor-http:latest

      - name: 构建并推送 sidecar 镜像
        uses: docker/build-push-action@v6
        with:
          context: sidecar
          file: sidecar/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reactor-http-sidecar:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/reactor-http-sidecar:latest

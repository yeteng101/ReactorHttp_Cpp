services:
  netdisk:
    # 网盘服务：编译 C++ 项目并运行（Linux 容器，Windows/Mac 可用 Docker Desktop）
    build:
      context: ..
      dockerfile: Dockerfile
    image: fuji-netdisk:3.0
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
    volumes:
      - netdisk-data:/data                # 用户文件（按用户名分子目录）
      - netdisk-users:/etc/reactor-http   # 账号口令文件 users.conf
    command: >
      /app/reactor-http --port 10000 --root /srv/www
      --min-workers 2 --max-workers 8
      --drive-root /data
      --users-file /etc/reactor-http/users.conf
      --sidecar-url http://sidecar:18666
      --max-connections 20000
    depends_on:
      - sidecar
    # 需要直连（不带 Caddy/域名）时取消下面注释：
    # ports:
    #   - "10000:10000"

  sidecar:
    # AI 网关 + GitHub/Apple OAuth 桥接：浏览器不直连，由 netdisk 本机转发
    build:
      context: ../sidecar
      dockerfile: Dockerfile
    image: fuji-sidecar:1.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SIDECAR_LISTEN: 0.0.0.0:18666
      SIDECAR_PUBLIC_BASE_URL: https://${DOMAIN:-localhost}
      # —— AI（也可登录后在网页「AI 设置」里改；环境变量优先级更高）——
      SIDECAR_AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      SIDECAR_AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      SIDECAR_AI_API_KEY: ${AI_API_KEY:-}
      # —— GitHub OAuth（https://github.com/settings/developers 注册 App）——
      SIDECAR_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      SIDECAR_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      # —— Apple「通过 Apple 登录」（需要 Apple Developer 会员）——
      SIDECAR_APPLE_SERVICE_ID: ${OAUTH_APPLE_SERVICE_ID:-}
      SIDECAR_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID:-}
      SIDECAR_APPLE_KEY_ID: ${OAUTH_APPLE_KEY_ID:-}
      SIDECAR_APPLE_PRIVATE_KEY_PATH: ${OAUTH_APPLE_PRIVATE_KEY_PATH:-}
    volumes:
      - sidecar-config:/cfg
    # 使用 Apple 登录时把 p8 私钥放进 ./secrets/ 并取消注释：
    # - ./secrets/AuthKey_XXXXXXXXXX.p8:/run/secrets/apple_auth_key.p8:ro

  caddy:
    # HTTPS 反代 + 自动证书（Let's Encrypt）。不需要域名时可移除本服务
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - netdisk

volumes:
  netdisk-data:
  netdisk-users:
  sidecar-config:
  caddy-data:
  caddy-config:

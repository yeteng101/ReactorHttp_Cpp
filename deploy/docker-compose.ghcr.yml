# 服务器「直接拉镜像」版 compose：不用 clone 源码、不用在服务器上编译。
# 只需要本文件 + Caddyfile + .env 三个文件即可部署。
#
# 首次部署：
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
# 以后每次更新（数据卷不受影响）：
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# 镜像由 GitHub Actions 在每次推送后自动构建：见 .github/workflows/publish.yml
services:
  netdisk:
    # 默认跟踪 feature/cloud-drive 分支的最新构建；也可在 .env 里固定版本，
    # 例如 NETDISK_IMAGE=ghcr.io/yeteng101/reactor-http:v3.1.0
    image: ${NETDISK_IMAGE:-ghcr.io/yeteng101/reactor-http:latest}
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
    volumes:
      - netdisk-data:/data                # 用户文件（按用户名分子目录）
      - netdisk-users:/etc/reactor-http   # 账号口令文件 users.conf
    command: >
      /app/reactor-http --port 18080 --root /srv/www
      --min-workers 2 --max-workers 8
      --drive-root /data
      --users-file /etc/reactor-http/users.conf
      --sidecar-url http://sidecar:18666
      --max-connections 20000
    depends_on:
      - sidecar
    # 无域名、想用 IP:18080 直连调试时取消注释（仅调试，正式请用 Caddy HTTPS）：
    # ports:
    #   - "18080:18080"

  sidecar:
    # 仅用于 GitHub/Apple OAuth 的 HTTPS 桥接；AI 由 netdisk 直连，不经过它
    image: ${SIDECAR_IMAGE:-ghcr.io/yeteng101/reactor-http-sidecar:latest}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SIDECAR_LISTEN: 0.0.0.0:18666
      SIDECAR_PUBLIC_BASE_URL: https://${DOMAIN:-localhost}
      SIDECAR_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      SIDECAR_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      SIDECAR_APPLE_SERVICE_ID: ${OAUTH_APPLE_SERVICE_ID:-}
      SIDECAR_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID:-}
      SIDECAR_APPLE_KEY_ID: ${OAUTH_APPLE_KEY_ID:-}
      SIDECAR_APPLE_PRIVATE_KEY_PATH: ${OAUTH_APPLE_PRIVATE_KEY_PATH:-}
    volumes:
      - sidecar-config:/cfg

  caddy:
    # HTTPS 反代 + 自动证书（Let's Encrypt）。不需要域名时可移除本服务
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - netdisk

volumes:
  netdisk-data:
  netdisk-users:
  sidecar-config:
  caddy-data:
  caddy-config:
